name: Android (ARM64)

on:
  push:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  pull_request:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: 24
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  guard-hardcoded-paths:
    name: No hardcoded developer paths in build scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Scan for absolute developer-machine paths
        run: |
          # The scripts must derive all paths from their own location and environment
          # variables. A match on /Users/ or /home/<user> sources is a regression.
          if grep -RInE '/Users/|/home/[a-z]+/' thirdparty/*.sh; then
            echo "::error::Hardcoded developer paths found in thirdparty scripts"
            exit 1
          fi

  build-apk:
    name: Build ARM64 APK (Release)
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 9.0 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
      - name: Install SDK platforms and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK_VERSION}" \
              "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build native libraries (FreeType, Lua, OpenAL Soft)
        run: |
          sh ./thirdparty/build-freetype-android.sh
          sh ./thirdparty/build-lua-android.sh
          sh ./thirdparty/build-openal-android.sh

      - name: Verify native libraries are ARM64
        run: |
          for so in OpenRA.Android/jniLibs/arm64-v8a/*.so; do
            echo "--- $so"
            file "$so"
            file "$so" | grep -q "aarch64" || { echo "::error::$so is not ARM64"; exit 1; }
          done

      - name: Build APK (Release)
        run: |
          # -m:1: ILLink (size optimization) is memory-hungry; a single MSBuild node keeps
          # peak memory bounded so the build fails only on real errors, not OOM flakes.
          dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android -p:BuildForAndroid=true -m:1

      - name: Verify APK contains the expected native libraries
        run: |
          APK=$(ls OpenRA.Android/obj/Release/android/bin/*.apk | head -1)
          unzip -l "$APK" | tee apk-list.txt
          for lib in lib/arm64-v8a/libfreetype6.so lib/arm64-v8a/liblua51.so lib/arm64-v8a/libsoft_oal.so; do
            grep -q "$lib" apk-list.txt || { echo "::error::$lib missing from APK"; exit 1; }
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openra-android-arm64
          path: OpenRA.Android/obj/Release/android/bin/*.apk
          if-no-files-found: error
