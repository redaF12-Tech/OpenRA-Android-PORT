name: Build Android APK (ARM64)

on:
  push:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/build-android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  pull_request:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/build-android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  workflow_dispatch:
    inputs:
      run_engine_tests:
        description: 'Run engine tests before building APK'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANDROID_API: 24
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  engine-tests:
    name: Engine tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_engine_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: make tests

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK_VERSION}" \
              "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Build native libraries
        run: |
          bash thirdparty/build-freetype-android.sh
          bash thirdparty/build-lua-android.sh
          bash thirdparty/build-openal-android.sh
      - name: Build APK
        run: dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android -p:BuildForAndroid=true -m:1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openra-android-arm64
          path: |
            OpenRA.Android/bin/Release/net9.0-android/*.apk
            OpenRA.Android/obj/Release/android/bin/*.apk
          if-no-files-found: error
