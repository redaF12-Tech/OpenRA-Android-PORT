name: Build Android APK (ARM64)

on:
  push:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/build-android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  pull_request:
    branches:
      - main
      - android-native-port
    paths:
      - 'OpenRA.Android/**'
      - 'OpenRA.Platforms.Android/**'
      - 'OpenRA.Game/**'
      - 'thirdparty/*.sh'
      - '.github/workflows/build-android.yml'
      - 'mods/**'
      - 'glsl/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - 'global mix database.dat'
  workflow_dispatch:
    inputs:
      run_engine_tests:
        description: 'Run engine tests before building APK'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANDROID_API: 24
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  engine-tests:
    name: Engine tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_engine_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: make tests

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # packages: '' skips the action's default 'tools platform-tools' install, which fails
      # because the deprecated SDK 'tools' package is no longer published by sdkmanager.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK_VERSION}" \
              "cmake;${ANDROID_CMAKE_VERSION}"

          # Fail loudly if any required component failed to install.
          for pkg in "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"; do
            if ! sdkmanager --list 2>/dev/null | grep -qF "$pkg "; then
              echo "::error::Required Android SDK component failed to install: $pkg"
              exit 1
            fi
          done

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" || { echo "::error::NDK not found at $ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"; exit 1; }
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Build native libraries
        run: |
          sh ./thirdparty/build-freetype-android.sh
          sh ./thirdparty/build-lua-android.sh
          sh ./thirdparty/build-openal-android.sh

      - name: Verify native libraries are ARM64
        run: |
          for so in OpenRA.Android/jniLibs/arm64-v8a/*.so; do
            echo "--- $so"
            file "$so"
            file "$so" | grep -q "aarch64" || { echo "::error::$so is not ARM64"; exit 1; }
          done

      - name: Build APK (Release)
        run: |
          # -m:1: ILLink (size optimization) is memory-hungry; a single MSBuild node keeps
          # peak memory bounded so the build fails only on real errors, not OOM flakes.
          dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android -p:BuildForAndroid=true -m:1

      - name: Verify APK contains the expected native libraries
        id: artifact
        run: |
          APK=$(find OpenRA.Android -type f -name '*.apk' -not -name '*-debug.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No Release APK found after build"
            find OpenRA.Android -name '*.apk' -print
            exit 1
          fi
          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          unzip -l "$APK" | tee apk-list.txt
          for lib in lib/arm64-v8a/libfreetype6.so lib/arm64-v8a/liblua51.so lib/arm64-v8a/libsoft_oal.so; do
            grep -qF "$lib" apk-list.txt || { echo "::error::$lib missing from APK"; exit 1; }
          done

      - name: Upload APK artifact (Release ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: openra-android-arm64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
